<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Robos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#131c2b;--bg2:#17202e;--bg3:#0f1722;--line:#2a3648;--fg:#e6ebf2;--mut:#9aa7b8;--acc:#ff8a1f;--col:#ff8a1f;--trans:#3b9cff;--nd:#8892a0;--ok:#35c26b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{background:#fff;border-radius:8px;height:42px;min-width:114px;display:flex;align-items:center;justify-content:center;padding:0 10px;overflow:hidden}
.logo{padding:0;background:transparent}
.logo img{height:42px;width:auto;display:block;border-radius:8px}
.logo .wm{font:800 17px/1 system-ui,sans-serif;letter-spacing:.5px;color:#14338f;font-style:italic}
.ttl{min-width:0;flex:1 1 220px}
.ttl b{display:block;font-size:15px}
.ttl small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);line-height:1.5}
.ttl small.dim{opacity:.7}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 14px;text-align:center;min-width:58px}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut)}
.pill{display:flex;align-items:center;gap:8px;border:1px solid #1f6b3d;background:#12301f;color:var(--ok);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.pill.off{border-color:#7a2b2b;background:#321616;color:#ff6b6b}
.pill button{background:none;border:0;color:inherit;cursor:pointer;font-size:14px;padding:0}
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:8px 14px;font:600 12px inherit;cursor:pointer}
.btn:hover{color:var(--fg)}
#wrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
.filters{position:absolute;z-index:1000;top:10px;left:56px;width:260px;max-width:calc(100% - 66px);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.4);font-size:12px}
.filters h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.chips{display:grid;gap:6px}
.chk{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg3);cursor:pointer;font-size:13px;font-weight:600}
.chk input{width:16px;height:16px;margin:0;accent-color:var(--acc)}
.chk i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chk span{flex:1}
.chk em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);border-radius:999px;padding:5px 10px;font:600 12px inherit;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--mut))}
.chip em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.filters input{width:100%;margin-top:10px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg3);color:var(--fg)}
.pin{display:block;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.leaflet-popup-content-wrapper{background:var(--bg2);color:var(--fg);border-radius:12px;padding:0;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.leaflet-popup-content{margin:0;width:300px!important}
.leaflet-popup-tip{background:var(--bg2)}
.leaflet-container a.leaflet-popup-close-button{color:var(--mut);top:10px;right:10px;font-size:22px}
.card{padding:16px 16px 14px}
.card h3{margin:0;font-size:18px;color:#fff;padding-right:22px}
.alt{color:var(--acc);font-weight:700;font-size:13px;margin:2px 0 8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg3);margin-bottom:10px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1;border:0;padding:6px;border-radius:6px;background:var(--bg3);color:var(--mut);font:600 12px inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--bg2)}
.ph{width:100%;height:190px;border-radius:4px;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:#6f7d90;font-size:12px;text-align:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph[hidden]{display:none}
.meta{margin-top:12px;display:grid;gap:4px;font-size:12px;color:var(--mut)}
.meta .d{color:#c3ccd8;font-size:13px}
.meta b{color:var(--fg);font-weight:600}
.open{display:inline-block;margin-top:10px;font-size:12px;color:var(--acc)}
#tabla{position:absolute;inset:0;z-index:1100;background:var(--bg);overflow:auto;padding:12px 14px}
#tabla[hidden]{display:none}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--mut)}
.tools .btn{color:var(--fg);border-color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{position:sticky;top:-12px;background:var(--bg);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg2)}
@media(max-width:560px){.ttl small.dim{display:none}.stat{padding:4px 10px}}
</style></head><body>

const COLORS={'Columna':'#ff8a1f','Transversal':'#3b9cff','Sin dato':'#8892a0'};
const norm=t=>{t=(t||'').toLowerCase();return t.includes('transv')?'Transversal':t.includes('col')?'Columna':t?t.charAt(0).toUpperCase()+t.slice(1):'Sin dato'};
const colorOf=c=>COLORS[c]||'#b07cff';
const map=L.map('map');
const carto=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});
L.control.layers({'Calles (datos OpenStreetMap)':carto,'OpenStreetMap estándar (solo en web)':osm,'Satélite':sat}).addTo(map);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const thumb=id=>'https://drive.google.com/thumbnail?id='+id+'&sz=w700';
const view=id=>'https://drive.google.com/file/d/'+id+'/view';
function photo(id,label){
  if(!id) return '<div class="ph" data-k="'+label+'">Foto de "'+label+'" pendiente</div>';
  return '<div class="ph" data-k="'+label+'"><a href="'+view(id)+'" target="_blank" rel="noopener" style="display:block;width:100%;height:100%"><img loading="lazy" alt="'+label+'" src="'+thumb(id)+'"></a></div>';
}
function popup(p){
  let h='<div class="card"><h3>'+esc(p.calle)+'</h3>';
  if(p.altura) h+='<div class="alt">Altura '+esc(p.altura)+'</div>';
  h+='<span class="badge" style="--c:'+colorOf(p.cat)+'"><i></i>'+esc(p.cat)+'</span>';
  h+='<div class="tabs"><button class="on" data-t="Antes">Antes</button><button data-t="Después">Después</button></div>';
  h+=photo(p.antes,'Antes')+photo(p.despues,'Después').replace('class="ph"','class="ph" hidden');
  h+='<div class="meta">';
  if(p.fecha) h+='<span>'+esc(p.fecha)+'</span>';
  if(p.desc) h+='<span class="d">'+esc(p.desc)+'</span>';
  h+='<span><b>Coordenadas:</b> '+p.lat.toFixed(6)+', '+p.lon.toFixed(6)+'</span></div>';
  if(p.antes) h+='<a class="open" href="'+view(p.antes)+'" target="_blank" rel="noopener">Abrir foto original</a>';
  return h+'</div>';
}
const group=L.featureGroup().addTo(map);
let items=[];
function build(){
  items.forEach(i=>group.removeLayer(i.m));
  DATA.forEach(p=>p.cat=norm(p.tipo));
  items=DATA.map(p=>{
    const icon=L.divIcon({className:'',html:'<span class="pin" style="--c:'+colorOf(p.cat)+'"></span>',iconSize:[20,20],iconAnchor:[10,20],popupAnchor:[0,-20]});
    const m=L.marker([p.lat,p.lon],{icon}).bindPopup(()=>popup(p),{minWidth:300,maxWidth:300}).bindTooltip(p.calle+' '+p.altura);
    return {p,m,txt:[p.calle,p.altura,p.desc,p.cat].join(' ').toLowerCase()};
  });
}
map.on('popupopen',e=>{
  const root=e.popup.getElement();
  root.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
    root.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
    root.querySelectorAll('.ph').forEach(ph=>ph.hidden=ph.dataset.k!==b.dataset.t);
  }));
});
// filtros
let cats=[],counts={};
function stats(){
  cats=['Columna','Transversal','Sin dato'].concat([...new Set(DATA.map(p=>p.cat))].filter(c=>!COLORS[c]));
  counts={};DATA.forEach(p=>counts[p.cat]=(counts[p.cat]||0)+1);
}
let off=new Set();
const chips=document.getElementById('chips');
const LABEL={'Columna':'Columnas','Transversal':'Transversales'};
function drawChips(){
  chips.innerHTML='';
  cats.filter(c=>counts[c]).forEach(c=>{
    const l=document.createElement('label');l.className='chk';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=!off.has(c);
    cb.onchange=()=>{cb.checked?off.delete(c):off.add(c);apply(true)};
    l.appendChild(cb);
    l.insertAdjacentHTML('beforeend','<i style="--c:'+colorOf(c)+'"></i><span>'+esc(LABEL[c]||c)+'</span><em>'+counts[c]+'</em>');
    chips.appendChild(l);
  });
}
const $=id=>document.getElementById(id),q=$('q'),tbody=$('tbody');
let visible=[];
function apply(fit){
  const t=q.value.trim().toLowerCase();
  visible=items.filter(i=>!off.has(i.p.cat)&&(!t||i.txt.includes(t)));
  items.forEach(i=>group.removeLayer(i.m));
  visible.forEach(i=>group.addLayer(i.m));
  $('sMapa').textContent=visible.length;$('tcount').textContent=visible.length+' registros';
  tbody.innerHTML='';
  visible.forEach(i=>{
    const p=i.p,tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(p.calle)+'</td><td>'+esc(p.altura)+'</td><td><span class="badge" style="--c:'+colorOf(p.cat)+';margin:0"><i></i>'+esc(p.cat)+'</span></td><td>'+esc(p.fecha)+'</td><td>'+esc(p.desc)+'</td>';
    tr.onclick=()=>{showTabla(false);map.setView([p.lat,p.lon],18);i.m.openPopup()};
    tbody.appendChild(tr);
  });
  if(fit&&visible.length)map.fitBounds(L.featureGroup(visible.map(i=>i.m)).getBounds().pad(.15),{maxZoom:18});
}
q.addEventListener('input',()=>apply(true));
// tabla
function showTabla(on){$('tabla').hidden=!on;$('btnTabla').textContent=on?'🗺 Mapa':'☰ Tabla';if(!on)setTimeout(()=>map.invalidateSize(),0)}
$('btnTabla').onclick=()=>showTabla($('tabla').hidden);
// exportar CSV (respeta filtros y búsqueda)
function exportCsv(){
  const H=['Calle','Altura','Tipo','Lat','Lon','Foto Antes','Foto Despues','Fecha','Descripcion'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=visible.map(i=>{const p=i.p;return [p.calle,p.altura,p.cat,p.lat,p.lon,p.antes?view(p.antes):'',p.despues?view(p.despues):'',p.fecha,p.desc].map(q).join(',')});
  const blob=new Blob(['\ufeff'+[H.map(q).join(',')].concat(rows).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='mapa_robos_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('btnCsv').onclick=exportCsv;
// estado de conexión
function net(){const on=navigator.onLine;$('pill').classList.toggle('off',!on);$('pillTxt').textContent=on?'● En línea':'● Sin conexión'}
addEventListener('online',net);addEventListener('offline',net);net();
function setData(arr,fit){
  DATA=arr;build();stats();
  $('sTotal').textContent=DATA.length;drawChips();apply(false);
  if(fit&&items.length)map.fitBounds(L.featureGroup(items.map(i=>i.m)).getBounds().pad(.1));
}
// lectura online de Google Sheets
function parseCSV(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}
    else if(ch!=='\r')c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}
function fromRows(rows){
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const ix=(keys,ex=[])=>h.findIndex(x=>keys.some(k=>x.includes(k))&&!ex.some(e=>x.includes(e)));
  const C={calle:ix(['calle']),altura:ix(['altura']),tipo:ix(['tipo']),lat:ix(['lat']),lon:ix(['lon']),antes:ix(['foto','antes'],['despu']),despues:ix(['despu']),fecha:ix(['fecha']),desc:ix(['descr','observ','nota'])};
  if(C.lat<0||C.lon<0)throw new Error('columnas');
  const num=v=>parseFloat(String(v||'').replace(',','.'));
  const fid=v=>{const m=String(v||'').match(/\/d\/([\w-]+)/)||String(v||'').match(/id=([\w-]+)/);return m?m[1]:''};
  const g=(r,k)=>C[k]>=0&&r[C[k]]!=null?String(r[C[k]]).trim().replace(/\.0$/,''):'';
  return rows.slice(1).map(r=>({calle:g(r,'calle'),altura:g(r,'altura'),tipo:g(r,'tipo'),lat:num(r[C.lat]),lon:num(r[C.lon]),
    antes:fid(r[C.antes]),despues:C.despues>=0?fid(r[C.despues]):'',fecha:g(r,'fecha'),desc:g(r,'desc')})).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
}
let busy=false;
async function loadSheet(first){
  if(!SHEET_URL||busy)return;busy=true;$('refresh').style.opacity=.5;
  const m=SHEET_URL.match(/\/d\/([\w-]+)/),gid=SHEET_URL.match(/[#&?]gid=(\d+)/);
  let url=m?'https://docs.google.com/spreadsheets/d/'+m[1]+'/gviz/tq?tqx=out:csv'+(gid?'&gid='+gid[1]:''):SHEET_URL;
  url+=(url.includes('?')?'&':'?')+'_='+Date.now();
  try{
    const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const arr=fromRows(parseCSV(await r.text()));if(!arr.length)throw new Error('vacía');
    if(JSON.stringify(arr)!==JSON.stringify(DATA))setData(arr,first);
    $('pill').classList.remove('off');$('pillTxt').textContent='● En línea · '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    $('pill').classList.add('off');$('pillTxt').textContent='● Sin acceso a la planilla';
  }
  busy=false;$('refresh').style.opacity=1;
}
$('refresh').onclick=()=>SHEET_URL?loadSheet(false):location.reload();
setData(DATA,true);
loadSheet(true);
if(SHEET_URL)setInterval(()=>loadSheet(false),REFRESH_MS);
</script></body></html>
